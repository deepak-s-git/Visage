<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; }
    .container { position: relative; padding: 50px; }
    h1 { font-size: 50px; letter-spacing: 10px; }
    canvas { position: absolute; top: 0; left: 0; border: 1px solid red; opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container" id="container">
    <h1 id="title">Hello <span>World</span></h1>
    <canvas id="c"></canvas>
  </div>
  <script>
    const container = document.getElementById('container');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;

    const walk = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
    let n;
    while(n = walk.nextNode()) {
      const text = n.textContent.trim();
      if (text.length > 0) {
        const range = document.createRange();
        range.selectNodeContents(n);
        const rect = range.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        
        const style = window.getComputedStyle(n.parentElement);
        ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
        ctx.fillStyle = 'lime';
        ctx.letterSpacing = style.letterSpacing !== 'normal' ? style.letterSpacing : '0px';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        
        const x = rect.left - containerRect.left;
        const y = rect.top - containerRect.top;
        ctx.fillText(text, x, y);
      }
    }
  </script>
</body>
</html>
